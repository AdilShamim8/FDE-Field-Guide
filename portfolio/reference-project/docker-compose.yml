services:
  etise-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: etise-api
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=ETISE-Enterprise-Triage
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - STRICT_GROUNDING_REFUSAL=true
      - CONFIDENCE_THRESHOLD=0.85
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
