name: Verify guide and reference

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            portfolio/reference-project/requirements.txt
            portfolio/reference-project/requirements.lock
      - name: Install tested dependency constraints
        run: |
          python -m pip install -r portfolio/reference-project/requirements.txt -c portfolio/reference-project/requirements.lock
          python -m pip check
      - name: Exercise runtime failure boundaries
        run: python -m pytest interviews/code/ portfolio/reference-project/tests/ job-market/dataset/tests/ learning-paths/foundations/code/ research/tests/ -q
      - name: Check known regression contracts
        run: python portfolio/reference-project/evals/run_evals.py --report "$RUNNER_TEMP/etise-regression.json"
      - name: Validate fixture declarations and dataset accounting
        run: |
          python portfolio/reference-project/evals/curate_eval_dataset.py
          python interviews/dataset/validate_dataset.py
          python interviews/dataset/ten_pass_verification.py
          python job-market/dataset/validate_market_data.py
          python job-market/dataset/validate_market_snapshot.py
          python research/validate_evidence.py
      - name: Check portable local documentation links
        run: python tools/check_links.py
      - name: Retain regression report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: etise-regression
          path: ${{ runner.temp }}/etise-regression.json
          if-no-files-found: warn
          retention-days: 14
